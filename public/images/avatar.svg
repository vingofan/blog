<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800" role="img" aria-label="替换为你的照片">
  <defs>
    <linearGradient id="g-avatar" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="55%" stop-color="#3d3d3d"/>
      <stop offset="100%" stop-color="#9a9a9a"/>
    </linearGradient>
    <filter id="n-avatar" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="url(#g-avatar)"/>
  <rect width="100%" height="100%" filter="url(#n-avatar)" opacity="0.07"/>
  <g fill="#ffffff" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif">
    <text x="50%" y="376" font-size="44" font-weight="600" letter-spacing="10" opacity="0.92">AVATAR</text>
    <text x="50%" y="428" font-size="29" opacity="0.65">替换为你的照片</text>
  </g>
  <text x="50%" y="764" fill="#ffffff" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace" font-size="21" opacity="0.45">PLACEHOLDER 800x800</text>
</svg>
